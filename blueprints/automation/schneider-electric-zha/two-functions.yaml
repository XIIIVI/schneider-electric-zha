blueprint:
  name: "Schneider Electric ZHA — 2 functions (1 endpoint × up/down)"
  description: >
    Runs two independent actions from the one endpoint of a Schneider Electric
    Zigbee wall switch paired through ZHA — one when it is pressed up, one when
    it is pressed down.


    For a device exposing two endpoints (2 rocker pairs, 4 functions), see
    `four-functions.yaml` instead.


    Supports both device families:

    - AIRLINK / FLS (`FLS/AIRLINK/4`) — rockers emit OnOff commands
      (cluster 6: `on` / `off`).

    - Wiser shutter switch (`NHPB/SHUTTER/1`, `1GANG/SHUTTER/1`) — rockers emit
      Window Covering commands (cluster 258: `up_open` / `down_close`).
      `up_open` is treated as ON, `down_close` as OFF.


    Attribute-update noise is ignored by requiring `args: []`.


    The `extra_areas` and `extra_labels` variables are available inside every
    action sequence, so an action can target the areas or the labels declared
    below, for example `target: {area_id: "{{ extra_areas }}"}`.


    Home Assistant's automation schema has no icon, label, area or category key,
    so those are set on the automation itself once it exists — see the README.


    Tags: schneider electric, zha
  domain: automation
  author: XIIIVI
  source_url: https://github.com/XIIIVI/schneider-electric-zha/blob/main/blueprints/automation/schneider-electric-zha/two-functions.yaml
  homeassistant:
    min_version: 2024.10.0
  input:
    zha_device:
      name: "Schneider Electric ZHA device"
      description: "AIRLINK/FLS switch or Wiser shutter switch, paired through ZHA."
      selector:
        device:
          filter:
            - integration: zha
              model: FLS/AIRLINK/4
            - integration: zha
              model: NHPB/SHUTTER/1
            - integration: zha
              model: 1GANG/SHUTTER/1

    endpoint:
      name: "Endpoint"
      description: "ZHA endpoint of this rocker (21 on both families)."
      default: 21
      selector:
        number:
          min: 1
          max: 240
          mode: box

    action_on:
      name: "Action — rocker pressed up (ON)"
      selector:
        action:

    action_off:
      name: "Action — rocker pressed down (OFF)"
      selector:
        action:

    extra_targets:
      name: "Additional targets"
      icon: mdi:target
      collapsed: true
      input:
        extra_areas:
          name: "Additional areas"
          description: >
            Exposed to both action sequences as the `extra_areas` variable.
          default: []
          selector:
            area:
              multiple: true

        extra_labels:
          name: "Additional labels"
          description: >
            Exposed to both action sequences as the `extra_labels` variable.
          default: []
          selector:
            label:
              multiple: true

variables:
  extra_areas: !input extra_areas
  extra_labels: !input extra_labels

triggers:
  # ON (OnOff switch) / UP (shutter switch)
  - trigger: event
    event_type: zha_event
    event_data:
      device_id: !input zha_device
      endpoint_id: !input endpoint
      cluster_id: 6
      command: "on"
      args: []
    id: "on"

  - trigger: event
    event_type: zha_event
    event_data:
      device_id: !input zha_device
      endpoint_id: !input endpoint
      cluster_id: 258
      command: up_open
      args: []
    id: "on"

  # OFF (OnOff switch) / DOWN (shutter switch)
  - trigger: event
    event_type: zha_event
    event_data:
      device_id: !input zha_device
      endpoint_id: !input endpoint
      cluster_id: 6
      command: "off"
      args: []
    id: "off"

  - trigger: event
    event_type: zha_event
    event_data:
      device_id: !input zha_device
      endpoint_id: !input endpoint
      cluster_id: 258
      command: down_close
      args: []
    id: "off"

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: "on"
        sequence: !input action_on

      - conditions:
          - condition: trigger
            id: "off"
        sequence: !input action_off

mode: queued
max: 10
