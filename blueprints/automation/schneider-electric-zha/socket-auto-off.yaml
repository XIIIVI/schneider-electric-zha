blueprint:
  name: "Schneider Electric ZHA — socket auto-off on low power"
  description: >
    Switches a Schneider Electric Zigbee socket off once the appliance plugged
    into it has been drawing less than a given power for long enough — a PC that
    went to sleep, a charger that finished, an EV cable left plugged in.


    Works with any socket reporting `SOCKET/OUTLET/1` or `SOCKET/OUTLET/2`
    through ZHA. Pick the socket and nothing else: the power sensor is found on
    the device itself (the entity whose `device_class` is `power`), and the
    switch-off targets the device, so renaming either entity cannot break the
    automation.


    A socket exposing several power sensors is switched off only once the
    highest of them is below the threshold.


    The automation never fires while the reading is `unavailable` or `unknown` —
    a socket whose sensor dropped off the network stays on.


    Home Assistant's automation schema has no icon, label, area or category key,
    so those are set on the automation itself once it exists — see the README.


    Tags: schneider electric, zha
  domain: automation
  author: XIIIVI
  source_url: https://github.com/XIIIVI/schneider-electric-zha/blob/main/blueprints/automation/schneider-electric-zha/socket-auto-off.yaml
  homeassistant:
    min_version: 2024.10.0
  input:
    socket_device:
      name: "Schneider Electric socket"
      description: "Zigbee socket paired through ZHA. Every switch it exposes is turned off."
      selector:
        device:
          filter:
            - integration: zha
              model: SOCKET/OUTLET/1
            - integration: zha
              model: SOCKET/OUTLET/2

    power_threshold:
      name: "Power threshold"
      description: >
        The socket is switched off once its power sensor stays strictly below
        this value.
      default: 20
      selector:
        number:
          min: 0
          max: 3680
          step: 1
          unit_of_measurement: W
          mode: box

    below_for:
      name: "For how long"
      description: "How long the power must stay below the threshold before switching off."
      default:
        hours: 0
        minutes: 3
        seconds: 0
      selector:
        duration:

    extra_targets:
      name: "Additional targets"
      icon: mdi:target
      collapsed: true
      input:
        extra_areas:
          name: "Additional areas"
          description: >
            Every entity of these areas is switched off together with the socket.
            Leave empty to switch off only the socket.
          default: []
          selector:
            area:
              multiple: true

        extra_labels:
          name: "Additional labels"
          description: >
            Every entity carrying one of these labels is switched off together
            with the socket. Leave empty to switch off only the socket.
          default: []
          selector:
            label:
              multiple: true

trigger_variables:
  socket_device: !input socket_device
  power_threshold: !input power_threshold

triggers:
  # The socket's own power sensor, resolved from the device: no second input to
  # keep in sync, and nothing breaks when the sensor is renamed.
  - trigger: template
    value_template: >
      {% set readings = expand(device_entities(socket_device))
           | selectattr('domain', 'eq', 'sensor')
           | selectattr('attributes.device_class', 'defined')
           | selectattr('attributes.device_class', 'eq', 'power')
           | map(attribute='state') | select('is_number') | map('float') | list %}
      {{ readings | count > 0 and (readings | max) < power_threshold }}
    for: !input below_for

actions:
  - action: homeassistant.turn_off
    target:
      device_id: !input socket_device
      area_id: !input extra_areas
      label_id: !input extra_labels

mode: single
