<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340" font-family="Verdana, Arial, sans-serif">
  <title>Two ZHA endpoints, one rocker pair each</title>
  <rect width="700" height="340" fill="#f4f4f5"/>
  <text x="350" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f2933">AIRLINK / FLS switch — 2-gang mode</text>
  <text x="350" y="48" text-anchor="middle" font-size="13" fill="#52606d">One physical plate, two independent rockers side by side</text>

  <!-- 2-gang paddle, split down the middle, drawn from the official Exxact user guide's device photo (WDE002924) -->
  <g transform="translate(190,68)">
    <rect x="55" y="8" width="16" height="26" rx="3" fill="#3e4c59"/>
    <rect x="55" y="150" width="16" height="26" rx="3" fill="#3e4c59"/>
    <rect x="249" y="8" width="16" height="26" rx="3" fill="#3e4c59"/>
    <rect x="249" y="150" width="16" height="26" rx="3" fill="#3e4c59"/>
    <rect x="20" y="20" width="280" height="150" rx="10" fill="#ffffff" stroke="#cbd2d9" stroke-width="2"/>
    <line x1="160" y1="20" x2="160" y2="170" stroke="#cbd2d9" stroke-width="2"/>
    <line x1="20" y1="95" x2="160" y2="95" stroke="#e4e7eb" stroke-width="1.5" stroke-dasharray="4 4"/>
    <line x1="160" y1="95" x2="300" y2="95" stroke="#e4e7eb" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="90" cy="95" r="4" fill="#9aa5b1"/>
    <circle cx="230" cy="95" r="4" fill="#9aa5b1"/>
    <path d="M 90 55 l -10 14 h 20 z" fill="#7b8794"/>
    <path d="M 90 135 l -10 -14 h 20 z" fill="#7b8794"/>
    <path d="M 230 55 l -10 14 h 20 z" fill="#7b8794"/>
    <path d="M 230 135 l -10 -14 h 20 z" fill="#7b8794"/>
    <text x="90" y="205" text-anchor="middle" font-size="12" fill="#334e68">endpoint 21</text>
    <text x="230" y="205" text-anchor="middle" font-size="12" fill="#334e68">endpoint 22</text>
  </g>

  <g font-size="12" fill="#334e68">
    <text x="10" y="110">Left rocker</text>
    <text x="10" y="128">▲ up → "on"</text>
    <text x="10" y="170">▼ down → "off"</text>
    <text x="690" y="110" text-anchor="end">Right rocker</text>
    <text x="690" y="128" text-anchor="end">▲ up → "on"</text>
    <text x="690" y="170" text-anchor="end">▼ down → "off"</text>
  </g>

  <text x="350" y="290" text-anchor="middle" font-size="12" fill="#52606d">Wiser shutter switches expose a single endpoint (21) only — this layout is AIRLINK/FLS-only.</text>
  <text x="350" y="315" text-anchor="middle" font-size="11" fill="#7b8794">Original schematic, redrawn from Schneider Electric's own device user guide — not the manufacturer's photo.</text>
</svg>
