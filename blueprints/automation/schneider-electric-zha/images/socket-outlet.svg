<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 260" font-family="Verdana, Arial, sans-serif">
  <title>Schneider Electric Zigbee socket</title>
  <rect width="620" height="260" fill="#f4f4f5"/>
  <text x="310" y="26" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f2933">Zigbee socket (SOCKET/OUTLET/1 or /2)</text>

  <g transform="translate(250,45)">
    <!-- Odace socket faceplate, drawn from the official product photo (S520559) -->
    <rect x="0" y="0" width="24" height="18" rx="3" fill="#3e4c59"/>
    <rect x="96" y="0" width="24" height="18" rx="3" fill="#3e4c59"/>
    <rect x="0" y="142" width="24" height="18" rx="3" fill="#3e4c59"/>
    <rect x="96" y="142" width="24" height="18" rx="3" fill="#3e4c59"/>
    <rect x="10" y="10" width="100" height="140" rx="8" fill="#ffffff" stroke="#cbd2d9" stroke-width="2"/>
    <circle cx="60" cy="80" r="42" fill="none" stroke="#cbd2d9" stroke-width="2"/>
    <circle cx="45" cy="90" r="6" fill="#7b8794"/>
    <circle cx="75" cy="90" r="6" fill="#7b8794"/>
    <circle cx="60" cy="60" r="5" fill="#9aa5b1"/>
    <text x="60" y="28" text-anchor="middle" font-size="10" fill="#9aa5b1">TOP</text>
  </g>

  <text x="310" y="225" text-anchor="middle" font-size="12" fill="#52606d">No rocker — triggered by the socket's own power sensor, not a button press.</text>
  <text x="310" y="245" text-anchor="middle" font-size="11" fill="#7b8794">Original schematic, redrawn from Schneider Electric's own product photo — not the manufacturer's photo.</text>
</svg>
