blueprint:
  name: "Schneider FLS/AIRLINK/4 — 2 Rockers ON/OFF"
  description: >
    Controls 2 entities with 2 rockers (ON/OFF each).
    Each rocker uses one ZHA endpoint. Ignores attribute_updated
    events by requiring args: [].
  domain: automation
  input:
    zha_device:
      name: "Schneider FLS/AIRLINK/4 device"
      selector:
        device:
          integration: zha
          model: FLS/AIRLINK/4

    endpoint_rocker1:
      name: "Endpoint Rocker 1"
      default: 21
      selector:
        number:
          min: 1
          max: 240
          mode: box

    entity_rocker1:
      name: "Entity controlled by Rocker 1"
      selector:
        entity:
          domain: [light, switch, input_boolean]

    endpoint_rocker2:
      name: "Endpoint Rocker 2"
      default: 22
      selector:
        number:
          min: 1
          max: 240
          mode: box

    entity_rocker2:
      name: "Entity controlled by Rocker 2"
      selector:
        entity:
          domain: [light, switch, input_boolean]

trigger:
  # Rocker 1
  - platform: event
    event_type: zha_event
    event_data:
      device_id: !input zha_device
      endpoint_id: !input endpoint_rocker1
      cluster_id: 6
      command: "on"
      args: []
    id: r1_on

  - platform: event
    event_type: zha_event
    event_data:
      device_id: !input zha_device
      endpoint_id: !input endpoint_rocker1
      cluster_id: 6
      command: "off"
      args: []
    id: r1_off

  # Rocker 2
  - platform: event
    event_type: zha_event
    event_data:
      device_id: !input zha_device
      endpoint_id: !input endpoint_rocker2
      cluster_id: 6
      command: "on"
      args: []
    id: r2_on

  - platform: event
    event_type: zha_event
    event_data:
      device_id: !input zha_device
      endpoint_id: !input endpoint_rocker2
      cluster_id: 6
      command: "off"
      args: []
    id: r2_off

action:
  - choose:
      - conditions:
          - condition: trigger
            id: r1_on
        sequence:
          - service: homeassistant.turn_on
            target:
              entity_id: !input entity_rocker1

      - conditions:
          - condition: trigger
            id: r1_off
        sequence:
          - service: homeassistant.turn_off
            target:
              entity_id: !input entity_rocker1

      - conditions:
          - condition: trigger
            id: r2_on
        sequence:
          - service: homeassistant.turn_on
            target:
              entity_id: !input entity_rocker2

      - conditions:
          - condition: trigger
            id: r2_off
        sequence:
          - service: homeassistant.turn_off
            target:
              entity_id: !input entity_rocker2

mode: queued
max: 10
